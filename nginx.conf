# =====================================================================
# Main reverse proxy for all Wazzifni services (runs in wazzifni-nginx)
#
# IMPORTANT: upstreams that live in other docker-compose projects are
# referenced through variables + the Docker DNS resolver (127.0.0.11).
# This way nginx STARTS EVEN IF an upstream container is down — that
# single service returns 502 instead of crashing nginx for every site.
# =====================================================================

# ---------- HTTP -> HTTPS redirects ----------
server {
    listen 80;
    server_name backend.wazzifni.online;
    return 301 https://backend.wazzifni.online$request_uri;
}

server {
    listen 80;
    server_name admin.wazzifni.online;
    return 301 https://admin.wazzifni.online$request_uri;
}

server {
    listen 80;
    server_name web.wazzifni.net;
    return 301 https://web.wazzifni.net$request_uri;
}

server {
    listen 80;
    server_name ad.wazzifni.net;
    return 301 https://ad.wazzifni.net$request_uri;
}

server {
    listen 80;
    server_name iraq.autotap.site;
    return 301 https://iraq.autotap.site$request_uri;
}

# ---------- ad.wazzifni.net : admin frontends + unified sales API ----------
server {
    listen 443 ssl;
    server_name ad.wazzifni.net;

    ssl_certificate /etc/letsencrypt/live/ad.wazzifni.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad.wazzifni.net/privkey.pem;

    # Upstream backend running on host loopback port 3000
    set $sales_backend 127.0.0.1:3000;

    root /usr/share/nginx/html;
    index index.html;

    # Main admin choice page
    location = / {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Sales System (Admin & Rep)
    location /sales/ {
        try_files $uri $uri/ /sales/index.html;
    }

    # HR system for admin
    location /hr/ {
        try_files $uri $uri/ /hr/index.html;
    }

    # Public landing page (primary home is https://web.wazzifni.net)
    # NOTE: the landing page links to /course/, which on THIS host is the
    # admin-side course app below, not the public portal.
    location /landing/ {
        alias /usr/share/nginx/html/landing/web/;
        index index.html;
    }

    # IT Land Iraq company page — the same files served at
    # https://web.wazzifni.net/itland/. Routed here too because the landing
    # page links to it with an absolute /itland/ path.
    location /itland/ {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /itland/index.html;
    }

    # Course management system (Admin)
    # admin.html references its assets relatively ("css/main.css"), so it must
    # be served from /course/admin.html — at the directory-style URL
    # /course/admin/ the browser would resolve them to /course/admin/css/...,
    # which does not exist, and try_files would fall back to returning
    # admin.html itself in place of every stylesheet and script.
    # Redirect instead of rewriting so the browser's base URL is corrected too.
    location = /course/admin  { return 301 /course/admin.html; }
    location = /course/admin/ { return 301 /course/admin.html; }

    # Course portal (User)
    location /course/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /course/index.html;
    }

    # Unified API (Sales & HR & Course)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads (Instructor images, etc.)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- web.wazzifni.net : public website (served from ./frontend/landing) ----------
# Was a separate container (wazzifni-website-nginx, built from the wazzifni-web
# repo). That repo is now merged into ./frontend/landing, so this host serves
# the same files straight off the shared frontend volume. The old container and
# its compose project can be removed.
server {
    listen 443 ssl;
    server_name web.wazzifni.net;

    ssl_certificate /etc/letsencrypt/live/web.wazzifni.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.wazzifni.net/privkey.pem;

    # Upstream backend running on host loopback port 3000
    set $sales_backend 127.0.0.1:3000;

    # Landing page: frontend/landing/web served at the domain root.
    # Reproduces the old Dockerfile's "COPY web/ /usr/share/nginx/html/".
    root /usr/share/nginx/html/landing/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public course portal: frontend/landing/course served at /course/.
    # Reproduces "COPY course/ /usr/share/nginx/html/course/". Its HTML uses
    # absolute /course/... asset paths, so root points at the landing dir and
    # nginx appends the /course/ prefix already present in the URI.
    location /course/ {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /course/index.html;
    }

    # CV builder: frontend/landing/cv served at /cv/.
    # Reproduces "COPY cv/ /usr/share/nginx/html/cv/". It loads the shared
    # translation scripts and logo from /js/ and /assets/, which resolve to
    # landing/web through the root above.
    location /cv/ {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /cv/index.html;
    }

    # IT Land Iraq company page: frontend/landing/itland served at /itland/.
    # Same shape as /course/ above — root points at the landing dir and nginx
    # appends the /itland/ prefix already present in the URI. Unlike the course
    # portal this page references its CSS/JS relatively ("css/main.css"), so it
    # keeps working if it is ever mounted under a different prefix.
    location /itland/ {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /itland/index.html;
    }

    # Course API for the public portal.
    # landing/course/js/services/ApiService.js has BASE_URL = '/api-proxy/course',
    # so /api-proxy/course/courses -> backend /api/course/courses.
    # The rewrite is required because proxy_pass uses a variable upstream, which
    # disables nginx's automatic location-prefix replacement.
    location /api-proxy/ {
        rewrite ^/api-proxy/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plain API passthrough, same upstream as /api-proxy/ above.
    # Needed because landing/itland/js/components/contact-form.js posts project
    # inquiries to /api/course/inquiries, and that page is served from BOTH this
    # host and ad.wazzifni.net — a single absolute path has to resolve on each,
    # so the prefix cannot be the /api-proxy/ alias that only exists here.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Instructor images and other backend uploads referenced by course data
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
    }

    # Job feed for the landing page (landing/web/js/components/jobs.js).
    #   /wazzifni-proxy/services/app/Job/GetAll
    #     -> https://api.wazzifni.net/api/services/app/Job/GetAll
    # Proxied instead of being called directly from the browser so the request
    # stays same-origin and does not depend on CORS headers from the API.
    # The rewrite is required because proxy_pass uses a variable upstream, which
    # disables nginx's automatic location-prefix replacement. Query strings are
    # carried over by the rewrite automatically.
    location /wazzifni-proxy/ {
        set $wazzifni_api api.wazzifni.net;
        rewrite ^/wazzifni-proxy/(.*)$ /api/$1 break;
        proxy_pass https://$wazzifni_api;

        # Upstream is a public HTTPS host: SNI and a matching Host header are
        # both required, so Host is pinned rather than passed through as $host.
        proxy_ssl_server_name on;
        proxy_ssl_name api.wazzifni.net;
        proxy_set_header Host api.wazzifni.net;

        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- iraq.autotap.site : ReadIraq backend (host port 8086) ----------
server {
    listen 443 ssl;
    server_name iraq.autotap.site;

    ssl_certificate /etc/letsencrypt/live/iraq.autotap.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iraq.autotap.site/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8086;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- backend.wazzifni.online : Wazzifni dev backend (host port 8088) ----------
server {
    listen 443 ssl;
    server_name backend.wazzifni.online;

    ssl_certificate /etc/letsencrypt/live/backend.wazzifni.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.wazzifni.online/privkey.pem;
    client_max_body_size 20M;

    location / {
        proxy_pass http://172.17.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- admin.wazzifni.online : Wazzifni dashboard (host port 8090) ----------
server {
    listen 443 ssl;
    server_name admin.wazzifni.online;

    ssl_certificate /etc/letsencrypt/live/admin.wazzifni.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.wazzifni.online/privkey.pem;
    client_max_body_size 20M;

    location / {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
