<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وظّفني — السير الذاتية المحفوظة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Same look as the HR system: its stylesheets, top bar, login screen, tables and modals -->
    <link rel="stylesheet" href="../hr/css/main.css">
    <link rel="stylesheet" href="../hr/css/components.css">
    <style>
        [hidden] { display: none !important; }
        .content { max-width: 1200px; margin: 0 auto; }
        a.tb-btn { text-decoration: none; }
        .sub { color: var(--tx3); font-size: .72rem; }
        .ltr { direction: ltr; unicode-bidi: embed; }
        td.actions { white-space: nowrap; }
        td.actions .btn + .btn { margin-inline-start: .35rem; }
        .err-msg { color: var(--red); font-size: .8rem; font-weight: 700; padding: .6rem .9rem; }
        .pb:disabled { opacity: .45; cursor: default; background: var(--surf); color: var(--tx2); border-color: var(--border); }
        #li-err { color: #ffaaaa; font-size: .78rem; font-weight: 700; text-align: center; margin-top: .8rem; min-height: 1em; }
        /* PDF viewer modal */
        .modal.pdf { width: 900px; max-width: 98vw; height: 92vh; max-height: 92vh; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
        .modal.pdf .mh { padding: 1rem 1.4rem .8rem; margin-bottom: 0; gap: .5rem; }
        .modal.pdf .mh-t { flex: 1; min-width: 0; }
        .modal.pdf .mh-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal.pdf iframe { flex: 1; border: none; width: 100%; background: var(--surf3); }
        @media (max-width: 600px) {
            .modal.pdf .mh { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- LOGIN: the HR admin account; the token is shared with /hr/ (localStorage wz_token) -->
<div id="loginScreen" class="hidden">
    <form class="lc" id="login">
        <div class="lc-logo-wrap"><div class="lc-logo">📄</div></div>
        <div class="lc-title">وظّفني</div>
        <div class="lc-sub">السير الذاتية المحفوظة — دخول بحساب إدارة التوظيف</div>
        <div class="lc-field">
            <label for="username">اسم المستخدم</label>
            <input id="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="lc-field">
            <label for="password">كلمة المرور</label>
            <input id="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        </div>
        <button class="lc-btn" type="submit">تسجيل الدخول ←</button>
        <div id="li-err"></div>
    </form>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="tb-brand">
        <div class="tb-icon">📄</div>
        <div class="tb-brand-text">
            <div class="tb-name">وظّفني</div>
            <div class="tb-sub">السير الذاتية المحفوظة</div>
        </div>
    </div>
    <div class="tb-center">
        <div class="tb-btns">
            <a class="tb-btn tb-load" href="index.html">→ اختيار النظام</a>
            <button class="tb-btn tb-out" id="btnLogout" type="button">خروج ⬅</button>
        </div>
    </div>
</div>
<div class="brand-bar"></div>

<div class="content">
    <div class="ph">
        <div>
            <div class="ph-t">السير الذاتية المحفوظة</div>
            <div class="ph-s" id="count">—</div>
        </div>
    </div>

    <div class="tw">
        <form class="tb-bar" id="search">
            <div class="sr-wrap"><input id="q" type="search" aria-label="بحث" placeholder="بحث بالاسم، المسمى، الهاتف، البريد أو المدينة..."></div>
            <button class="btn btn-primary btn-sm" type="submit">بحث</button>
        </form>
        <div class="err-msg" id="listError" hidden></div>
        <table>
            <thead><tr><th>الاسم</th><th>الهاتف / البريد</th><th>المدينة</th><th>تاريخ الحفظ</th><th>إجراءات</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="pag">
            <span id="pageInfo"></span>
            <div class="pag-bs">
                <button class="pb" id="prev" type="button" aria-label="السابق">›</button>
                <button class="pb" id="next" type="button" aria-label="التالي">‹</button>
            </div>
        </div>
    </div>
</div>

<!-- PDF VIEWER -->
<div class="overlay" id="viewer">
    <div class="modal pdf" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
        <div class="mh">
            <div class="mh-t"><div class="mh-ico">📄</div><span id="viewerTitle"></span></div>
            <a class="btn btn-ghost btn-sm" id="viewerOpen" target="_blank" rel="noopener">فتح في نافذة جديدة</a>
            <button class="btn btn-primary btn-sm" id="viewerDownload" type="button">تنزيل</button>
            <div class="mx" id="viewerClose" role="button" tabindex="0" aria-label="إغلاق">✕</div>
        </div>
        <iframe id="viewerFrame" title="معاينة السيرة الذاتية"></iframe>
    </div>
</div>

<script>
(function () {
    const TOKEN_KEY = 'wz_token';
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let page = 1, pages = 1, q = '', cvs = [], viewerUrl = null, viewerCv = null;

    class AuthError extends Error {}

    async function api(path, asBlob) {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) throw new AuthError();
        const res = await fetch('/api/cv' + path, { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) throw new AuthError();
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.message || body.error || 'حدث خطأ ما');
        }
        return asBlob ? res.blob() : res.json();
    }

    function showLogin() {
        localStorage.removeItem(TOKEN_KEY);
        $('loginScreen').classList.remove('hidden');
        $('username').focus();
    }

    function fail(e) {
        if (e instanceof AuthError) return showLogin();
        $('listError').textContent = e.message;
        $('listError').hidden = false;
    }

    const fmtDate = d => d ? new Date(d).toLocaleString('ar-IQ', { dateStyle: 'medium', timeStyle: 'short' }) : '';

    async function load() {
        $('listError').hidden = true;
        try {
            const data = await api('?' + new URLSearchParams({ page, q }));
            cvs = data.cvs; pages = data.pages;
            $('loginScreen').classList.add('hidden');
            $('count').textContent = `${data.total} سيرة ذاتية`;
            $('pageInfo').textContent = `صفحة ${data.page} من ${data.pages}`;
            $('prev').disabled = page <= 1;
            $('next').disabled = page >= pages;
            $('rows').innerHTML = cvs.length ? cvs.map((cv, i) => {
                const hasPdf = cv.pdfFile && cv.pdfFile.size;
                return `<tr>
                    <td><strong>${esc(cv.name || '—')}</strong><div class="sub">${esc(cv.title)}</div></td>
                    <td><div class="ltr">${esc(cv.phone)}</div><div class="sub ltr">${esc(cv.email)}</div></td>
                    <td>${esc(cv.city)}</td>
                    <td>${esc(fmtDate(cv.submittedAt))}</td>
                    <td class="actions">${hasPdf
                        ? `<button class="btn btn-ghost btn-sm" type="button" data-view="${i}">👁 معاينة</button><button class="btn btn-primary btn-sm" type="button" data-dl="${i}">⬇ تنزيل</button>`
                        : '<span class="badge b-gy">لا يوجد ملف PDF</span>'}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="5"><div class="empty"><div class="ei">📄</div><p>لا توجد سير ذاتية.</p></div></td></tr>';
        } catch (e) { fail(e); }
    }

    const fileName = cv => `السيرة الذاتية - ${(cv.name || 'مرشح').trim()}.pdf`.replace(/[\\/:*?"<>|]/g, '');

    function saveBlob(url, cv) {
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName(cv);
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    // The PDF route needs the token, so the file is fetched and shown/saved from a local blob URL
    async function pdfUrl(cv) {
        const blob = await api(`/${cv._id}/pdf`, true);
        return URL.createObjectURL(blob);
    }

    async function download(cv, btn) {
        btn.disabled = true;
        try {
            const url = await pdfUrl(cv);
            saveBlob(url, cv);
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        } catch (e) { fail(e); }
        finally { btn.disabled = false; }
    }

    async function preview(cv, btn) {
        btn.disabled = true;
        try {
            closeViewer();
            viewerUrl = await pdfUrl(cv);
            viewerCv = cv;
            $('viewerTitle').textContent = cv.name || 'سيرة ذاتية';
            $('viewerFrame').src = viewerUrl;
            $('viewerOpen').href = viewerUrl;
            $('viewer').classList.add('open');
        } catch (e) { fail(e); }
        finally { btn.disabled = false; }
    }

    function closeViewer() {
        $('viewer').classList.remove('open');
        $('viewerFrame').removeAttribute('src');
        if (viewerUrl) URL.revokeObjectURL(viewerUrl);
        viewerUrl = null;
        viewerCv = null;
    }

    $('rows').addEventListener('click', e => {
        const v = e.target.closest('[data-view]'), d = e.target.closest('[data-dl]');
        if (v) preview(cvs[+v.dataset.view], v);
        if (d) download(cvs[+d.dataset.dl], d);
    });
    $('viewerClose').onclick = closeViewer;
    $('viewerClose').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') closeViewer(); });
    $('viewer').addEventListener('click', e => { if (e.target === $('viewer')) closeViewer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && viewerUrl) closeViewer(); });
    $('viewerDownload').onclick = () => { if (viewerUrl) saveBlob(viewerUrl, viewerCv); };

    $('search').addEventListener('submit', e => { e.preventDefault(); q = $('q').value.trim(); page = 1; load(); });
    $('prev').onclick = () => { if (page > 1) { page--; load(); } };
    $('next').onclick = () => { if (page < pages) { page++; load(); } };
    $('btnLogout').onclick = showLogin;

    $('login').addEventListener('submit', async e => {
        e.preventDefault();
        $('li-err').textContent = '';
        try {
            const res = await fetch('/api/hr/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.token) throw new Error(body.message || body.error || 'بيانات الدخول غير صحيحة');
            localStorage.setItem(TOKEN_KEY, body.token);
            $('password').value = '';
            load();
        } catch (err) {
            $('li-err').textContent = err.message;
        }
    });

    if (localStorage.getItem(TOKEN_KEY)) load(); else showLogin();
})();
</script>
</body>
</html>
